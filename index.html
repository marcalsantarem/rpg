<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="theme-color" content="#000000">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; media-src 'self' data: blob:">
  <title>Sinos da Aurora</title>
  <style>
    html, body { margin: 0; padding: 0; background: #000; width: 100%; height: 100%; overflow: hidden; touch-action: none; -webkit-user-select: none; user-select: none; }
    #app { width: 100%; height: 100%; display: flex; flex-direction: column; }
    #game { flex: 1; min-height: 0; display: flex; align-items: center; justify-content: center; }
    canvas { image-rendering: pixelated; image-rendering: crisp-edges; }
    #touch { display: none; }

    /* ---- celular / tablet ---- */
    body.touch #touch { display: flex; align-items: center; justify-content: space-between; padding: 0 6vw; box-sizing: border-box; }
    #dpad { position: relative; width: 150px; height: 150px; border-radius: 50%; background: rgba(255,255,255,0.08); border: 2px solid rgba(255,255,255,0.18); }
    #dpad::before, #dpad::after { content: ''; position: absolute; background: rgba(255,255,255,0.22); border-radius: 8px; }
    #dpad::before { left: 50%; top: 12%; width: 30%; height: 76%; transform: translateX(-50%); }
    #dpad::after { top: 50%; left: 12%; height: 30%; width: 76%; transform: translateY(-50%); }
    #dpad[data-dir="up"] { box-shadow: inset 0 22px 18px -14px rgba(255,220,120,0.6); }
    #dpad[data-dir="down"] { box-shadow: inset 0 -22px 18px -14px rgba(255,220,120,0.6); }
    #dpad[data-dir="left"] { box-shadow: inset 22px 0 18px -14px rgba(255,220,120,0.6); }
    #dpad[data-dir="right"] { box-shadow: inset -22px 0 18px -14px rgba(255,220,120,0.6); }
    #btns { position: relative; width: 170px; height: 150px; }
    .btn { position: absolute; width: 70px; height: 70px; border-radius: 50%; border: 2px solid rgba(255,255,255,0.3);
           color: #fff; font: bold 26px sans-serif; display: flex; align-items: center; justify-content: center; }
    #btn-a { right: 0; top: 18px; background: rgba(200,160,60,0.55); }
    #btn-b { left: 0; bottom: 8px; background: rgba(120,120,180,0.5); }
    .btn.down { filter: brightness(1.6); transform: scale(0.94); }
    #btn-full { position: absolute; left: 50%; bottom: 8px; transform: translateX(-50%); background: rgba(255,255,255,0.1); color: #ccc;
                border: 1px solid rgba(255,255,255,0.25); border-radius: 6px; font: 12px sans-serif; padding: 4px 8px; }

    /* retrato: jogo ocupa a largura toda no topo, controles embaixo */
    @media (orientation: portrait) {
      body.touch #game { flex: 0 0 auto; width: 100vw; height: calc(100vw * 624 / 1104); }
      body.touch #touch { flex: 1; position: relative; }
    }
    /* paisagem: jogo em tela cheia, controles translúcidos por cima */
    @media (orientation: landscape) {
      body.touch #touch { position: fixed; inset: 0; pointer-events: none; align-items: flex-end; padding: 0 3vw 4vh; }
      body.touch #dpad, body.touch #btns, body.touch #btn-full { pointer-events: auto; }
      body.touch #dpad { opacity: 0.55; width: 130px; height: 130px; }
      body.touch #btns { opacity: 0.6; height: 130px; }
      body.touch #btn-full { position: fixed; top: 6px; bottom: auto; }
    }
  </style>
</head>
<body>
  <div id="app">
    <div id="game"></div>
    <div id="touch">
      <div id="dpad"></div>
      <button id="btn-full" type="button">Tela cheia</button>
      <div id="btns">
        <div class="btn" id="btn-b">B</div>
        <div class="btn" id="btn-a">A</div>
      </div>
    </div>
  </div>
  <script src="vendor/phaser.min.js"></script>
  <script type="module" src="src/main.js"></script>
</body>
</html>
