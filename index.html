<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="theme-color" content="#000000">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; media-src 'self' data: blob:">
  <title>Sinos da Aurora</title>
  <style>
    html, body { margin: 0; padding: 0; background: #000; width: 100%; height: 100%; overflow: hidden; touch-action: none; -webkit-user-select: none; user-select: none; }
    #app { width: 100%; height: 100%; display: flex; flex-direction: column; }
    #game { flex: 1; min-height: 0; display: flex; align-items: center; justify-content: center; }
    canvas { image-rendering: pixelated; image-rendering: crisp-edges; }
    #touch { display: none; }

    /* ---- celular / tablet ---- */
    body.touch #touch { display: flex; align-items: center; justify-content: space-between; padding: 0 6vw; box-sizing: border-box; }
    #dpad { position: relative; width: 150px; height: 150px; border-radius: 50%; background: rgba(255,255,255,0.08); border: 2px solid rgba(255,255,255,0.18); }
    #dpad::before, #dpad::after { content: ''; position: absolute; background: rgba(255,255,255,0.22); border-radius: 8px; }
    #dpad::before { left: 50%; top: 12%; width: 30%; height: 76%; transform: translateX(-50%); }
    #dpad::after { top: 50%; left: 12%; height: 30%; width: 76%; transform: translateY(-50%); }
    #dpad[data-dir="up"] { box-shadow: inset 0 22px 18px -14px rgba(255,220,120,0.6); }
    #dpad[data-dir="down"] { box-shadow: inset 0 -22px 18px -14px rgba(255,220,120,0.6); }
    #dpad[data-dir="left"] { box-shadow: inset 22px 0 18px -14px rgba(255,220,120,0.6); }
    #dpad[data-dir="right"] { box-shadow: inset -22px 0 18px -14px rgba(255,220,120,0.6); }
    #btns { position: relative; width: 170px; height: 150px; }
    .btn { position: absolute; width: 70px; height: 70px; border-radius: 50%; border: 2px solid rgba(255,255,255,0.3);
           color: #fff; font: bold 26px sans-serif; display: flex; align-items: center; justify-content: center; }
    #btn-a { right: 0; top: 18px; background: rgba(200,160,60,0.55); }
    #btn-b { left: 0; bottom: 8px; background: rgba(120,120,180,0.5); }
    .btn.down { filter: brightness(1.6); transform: scale(0.94); }
    #btn-full { position: absolute; left: 50%; bottom: 8px; transform: translateX(-50%); background: rgba(255,255,255,0.1); color: #ccc;
                border: 1px solid rgba(255,255,255,0.25); border-radius: 6px; font: 12px sans-serif; padding: 4px 8px; cursor: pointer; }

    /* ---- Overlay de aviso para girar o aparelho (modo paisagem forçado) ---- */
    #orientation-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: radial-gradient(circle at center, #1b1435 0%, #05040a 100%);
      z-index: 999999;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px;
      box-sizing: border-box;
      text-align: center;
      color: #fff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    .orientation-box {
      background: linear-gradient(180deg, #2e2858 0%, #0c0a1c 100%);
      border: 2px solid #f8e078;
      border-radius: 12px;
      box-shadow: 0 0 24px rgba(248, 224, 120, 0.25), inset 0 0 12px rgba(122, 116, 160, 0.4);
      padding: 24px 20px;
      max-width: 320px;
      width: 100%;
      box-sizing: border-box;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .phone-anim {
      position: relative;
      width: 70px;
      height: 70px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 14px;
    }

    .phone-mockup {
      width: 26px;
      height: 48px;
      border: 3px solid #f8e078;
      border-radius: 6px;
      box-shadow: 0 0 10px rgba(248, 224, 120, 0.5);
      animation: rotatePhone 2.2s ease-in-out infinite;
      position: relative;
    }
    .phone-mockup::before {
      content: '';
      position: absolute;
      top: 4px;
      left: 50%;
      transform: translateX(-50%);
      width: 8px;
      height: 2px;
      background: #f8e078;
      border-radius: 2px;
    }

    .rotate-arrow {
      position: absolute;
      font-size: 26px;
      color: #90b8ff;
      animation: pulseArrow 2.2s ease-in-out infinite;
      pointer-events: none;
    }

    @keyframes rotatePhone {
      0%, 20% { transform: rotate(0deg); }
      55%, 75% { transform: rotate(-90deg); }
      95%, 100% { transform: rotate(0deg); }
    }

    @keyframes pulseArrow {
      0%, 20% { opacity: 0.3; transform: scale(0.9); }
      55%, 75% { opacity: 1; transform: scale(1.15) rotate(-45deg); }
      95%, 100% { opacity: 0.3; transform: scale(0.9); }
    }

    .orientation-title {
      margin: 0 0 8px 0;
      color: #f8e078;
      font-size: 18px;
      letter-spacing: 1px;
      text-transform: uppercase;
    }

    .orientation-text {
      margin: 0 0 18px 0;
      font-size: 13px;
      line-height: 1.45;
      color: #d8d4e8;
    }

    .orientation-btn {
      width: 100%;
      border: none;
      border-radius: 8px;
      padding: 12px 14px;
      font-size: 14px;
      font-weight: bold;
      cursor: pointer;
      margin-bottom: 8px;
      transition: transform 0.1s, filter 0.1s;
    }
    .orientation-btn:active {
      transform: scale(0.97);
    }
    .orientation-btn.primary {
      background: #f8e078;
      color: #120e24;
      box-shadow: 0 2px 8px rgba(248, 224, 120, 0.4);
    }
    .orientation-btn.secondary {
      background: rgba(255, 255, 255, 0.12);
      color: #c8c4dc;
      border: 1px solid rgba(255, 255, 255, 0.25);
      font-size: 12px;
      padding: 8px 12px;
      margin-bottom: 0;
    }

    /* Em celular/touch em modo retrato, o overlay bloqueia a visualização pequena e exige modo paisagem */
    @media (orientation: portrait) {
      body.touch #orientation-overlay {
        display: flex;
      }
      body.touch #game {
        flex: 1;
        width: 100%;
        height: 100%;
      }
    }

    /* Caso o usuário force o giro em 90 graus via CSS (sem virar o celular) */
    body.force-rotate #orientation-overlay {
      display: none !important;
    }
    body.force-rotate #app {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vh !important;
      height: 100vw !important;
      transform-origin: top left;
      transform: rotate(90deg) translateY(-100%);
      overflow: hidden;
    }
    body.force-rotate #game {
      width: 100%;
      height: 100%;
      flex: 1;
    }
    body.force-rotate #touch {
      display: flex !important;
      position: fixed;
      inset: 0;
      pointer-events: none;
      align-items: flex-end;
      padding: 0 3vw 4vh;
    }
    body.force-rotate #dpad, body.force-rotate #btns, body.force-rotate #btn-full {
      pointer-events: auto;
    }
    body.force-rotate #dpad { opacity: 0.55; width: 130px; height: 130px; }
    body.force-rotate #btns { opacity: 0.6; height: 130px; }
    body.force-rotate #btn-full { position: fixed; top: 6px; bottom: auto; }

    /* modo paisagem nativo: jogo em tela cheia com alta resolução e controles confortáveis */
    @media (orientation: landscape) {
      #orientation-overlay {
        display: none !important;
      }
      body.touch #game {
        width: 100%;
        height: 100%;
        flex: 1;
      }
      body.touch #touch {
        position: fixed;
        inset: 0;
        pointer-events: none;
        align-items: flex-end;
        padding: 0 3vw 4vh;
      }
      body.touch #dpad, body.touch #btns, body.touch #btn-full { pointer-events: auto; }
      body.touch #dpad { opacity: 0.55; width: 130px; height: 130px; }
      body.touch #btns { opacity: 0.6; height: 130px; }
      body.touch #btn-full { position: fixed; top: 6px; bottom: auto; }
    }
  </style>
</head>
<body>
  <div id="app">
    <div id="game"></div>
    <div id="touch">
      <div id="dpad"></div>
      <button id="btn-full" type="button">Tela cheia</button>
      <div id="btns">
        <div class="btn" id="btn-b">B</div>
        <div class="btn" id="btn-a">A</div>
      </div>
    </div>
  </div>

  <!-- Overlay para forçar o modo paisagem no celular -->
  <div id="orientation-overlay">
    <div class="orientation-box">
      <div class="phone-anim">
        <div class="phone-mockup"></div>
        <div class="rotate-arrow">↻</div>
      </div>
      <h2 class="orientation-title">Modo Paisagem</h2>
      <p class="orientation-text">
        <strong>Sinos da Aurora</strong> requer tela na horizontal para melhor visualização. Por favor, gire o seu aparelho.
      </p>
      <button id="btn-lock-landscape" class="orientation-btn primary" type="button">
        Ativar Tela Cheia &amp; Paisagem
      </button>
      <button id="btn-force-rotate" class="orientation-btn secondary" type="button">
        Forçar Giro 90° na Vertical
      </button>
    </div>
  </div>

  <script src="vendor/phaser.min.js"></script>
  <script type="module" src="src/main.js"></script>
</body>
</html>
